# Staging / production stack: PostgreSQL + app + HTTPS (Caddy) + daily backups.
# Usage: cp .env.production.example .env.production && edit, then
#        docker compose --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sport_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sport -d sport_erp']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sport:${POSTGRES_PASSWORD}@db:5432/sport_erp
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      JWT_TTL: ${JWT_TTL:-12h}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN}
      TRUST_PROXY: 'true'
    expose:
      - '4000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: sport
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: sport_erp
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']

volumes:
  pgdata:
  caddy_data:
